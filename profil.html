<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Profil · abgeklopft.de</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="proto">Prototyp · Links funktionieren nur in diesem Browser</div>
<main class="wrap">
  <div class="lt">
    <p class="meta" id="padr" style="margin:0 0 8px"></p>
    <div class="lt-avatar" id="av"></div>
    <h1 id="pn"></h1>
    <p class="zeile" id="pz"></p>
    <p class="meta" id="po"></p>
  </div>
  <div class="lt-banner" id="banner"></div>
  <div id="liste"></div>
  <div class="lt-banner">
    <p class="meta" id="zusammen"></p>
    <div class="note" id="hinweis">Erfundenes Beispiel. Personen, Firmen und Hochschulen sind Platzhalter. Klicken Sie auf einen Eintrag, um Prüfweg, Prüfvermerk und Bestätigungen zu sehen.</div>
  </div>
</main>
<footer><div class="wrap" style="text-align:center">Geprüft mit <a href="index.html">abgeklopft.de</a> · <a href="verify.html">Wie lese ich die Stufen?</a><span class="rechtlich"> · <a href="impressum.html">Impressum</a> · <a href="datenschutz.html">Datenschutz</a></span></div></footer>
<script src="data.js"></script><script src="app.js"></script>
<script>
const $ = id => document.getElementById(id);
$("av").textContent = PROFIL.kuerzel; $("pn").textContent = PROFIL.name;
$("pz").textContent = PROFIL.zeile; $("po").textContent = PROFIL.ort;
$("padr").textContent = PROFIL.adresse || "";
if (!PROFIL.erfunden) $("hinweis").hidden = true;

const linkId = new URLSearchParams(location.search).get("l");
let eintraege = PORTFOLIO, beimOeffnen = null;
if (linkId) {
  const link = lesen(LINK_KEY).find(x => x.id === linkId);
  if (!link) {
    $("banner").innerHTML = `<div class="result bad">Dieser Link ist unbekannt. Im Prototyp funktionieren Links nur in dem Browser, in dem sie erstellt wurden.</div>`;
    eintraege = [];
  } else if (link.widerrufen || link.gueltigBis < heuteIso()) {
    $("banner").innerHTML = `<div class="result bad">Dieser Link ist ${link.widerrufen ? "widerrufen" : "abgelaufen"}. Bitte fragen Sie die Person nach einem neuen.</div>`;
    eintraege = [];
  } else {
    eintraege = PORTFOLIO.filter(p => link.auswahl.includes(p.id));
    $("banner").innerHTML = `<div class="result ok">Persönlicher Link für <b>${esc(link.empfaenger)}</b> · gültig bis ${esc(link.gueltigBis)}. ${PROFIL.name} sieht, wann dieser Link geöffnet wurde.</div>`;
    const oe = lesen(OEFF_KEY); oe.push({ link: linkId, zeit: new Date().toISOString(), eintrag: null }); schreiben(OEFF_KEY, oe);
    beimOeffnen = id => { const o = lesen(OEFF_KEY); o.push({ link: linkId, zeit: new Date().toISOString(), eintrag: id }); schreiben(OEFF_KEY, o); };
  }
}
profilZeigen("liste", eintraege, beimOeffnen);
const n = s => eintraege.filter(p => stufeVon(p) === s).length;
if (eintraege.length) $("zusammen").textContent = `${eintraege.length} Einträge: ${n(3)} von Dritten bestätigt, ${n(2)} Beleg geprüft, ${n(1)} eigene Angabe.`;
</script>
</body>
</html>
